server:
  port: 0

spring:
  application:
    name: users-service-test
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
  datasource:
    url: jdbc:h2:mem:users_testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS mc_music_users_schema
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false

jwt:
  secret: testSuperSecretKeyForUsersServiceAtLeast32CharactersLong2026!
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

catalog:
  service:
    url: http://localhost:8081
artist:
  service:
    url: http://localhost:8083

internal:
  api:
    secret: testSuperSecretKeyForInternalMicroserviceCommunication2026!

cloudinary:
  cloud-name: test-cloud
  api-key: "111111111111111"
  api-secret: test-cloudinary-secret

