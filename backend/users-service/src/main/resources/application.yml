server:
  port: 8082
spring:
  application:
    name: users-service
  datasource:
    password: ${DB_PASSWORD:Manhcuong281207@}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mc_music_db?currentSchema=mc_music_users_schema}
    username: ${DB_USERNAME:postgres}
  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
