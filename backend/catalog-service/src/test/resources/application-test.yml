server:
  port: 0

spring:
  application:
    name: catalog-service-test
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
  datasource:
    url: jdbc:h2:mem:catalog_testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS mc_music_catalog_schema
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false

jwt:
  secret:
    user: testSuperSecretKeyForUsersServiceAtLeast32CharactersLong2026!
    artist: testSuperSecretKeyForArtistsServiceAtLeast32CharactersLong2026!
    admin: testSuperSecretKeyForAdminServiceAtLeast32CharactersLong2026!

artists:
  service:
    url: http://localhost:8083

internal:
  api:
    secret: testSuperSecretKeyForInternalMicroserviceCommunication2026!

cloudinary:
  cloud-name: test-cloud
  api-key: "111111111111111"
  api-secret: test-cloudinary-secret

