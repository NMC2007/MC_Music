server:
  port: 0

spring:
  application:
    name: admin-service-test
  datasource:
    url: jdbc:h2:mem:admin_testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS mc_music_admin_schema
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false

jwt:
  secret: testSuperSecretKeyForAdminServiceAtLeast32CharactersLong2026!
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

users:
  service:
    url: http://localhost:8082

artists:
  service:
    url: http://localhost:8083

internal:
  api:
    secret: testSuperSecretKeyForInternalMicroserviceCommunication2026!

